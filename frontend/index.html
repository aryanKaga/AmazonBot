<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amazon Bot Assistant</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; background: #111827; color: #e5e7eb; }
    main { max-width: 900px; margin: 0 auto; padding: 32px 18px 60px; }
    h1 { margin-bottom: 6px; color: #fbbf24; }
    .muted { color: #9ca3af; }
    form, section { background: #1f2937; border: 1px solid #374151; border-radius: 12px; padding: 18px; margin-top: 18px; }
    label { display: block; font-size: 13px; color: #9ca3af; margin: 10px 0 6px; }
    input, textarea { box-sizing: border-box; width: 100%; background: #111827; color: #f9fafb; border: 1px solid #4b5563; border-radius: 8px; padding: 11px; font: inherit; }
    textarea { min-height: 100px; resize: vertical; }
    button { margin-top: 14px; background: #f59e0b; color: #111827; border: 0; border-radius: 8px; padding: 11px 18px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .card { background: #111827; border-radius: 8px; padding: 12px; }
    .value { color: #fbbf24; font-weight: 700; margin-top: 4px; }
    #answer { white-space: pre-wrap; line-height: 1.55; }
    .error { color: #fca5a5; }
    .success { color: #86efac; }
    .ticket { border: 1px solid #f59e0b; padding: 12px; border-radius: 8px; margin-top: 12px; }
    details { margin-top: 10px; background: #111827; padding: 10px; border-radius: 8px; }
    summary { cursor: pointer; color: #fbbf24; }
    pre { white-space: pre-wrap; overflow-x: auto; color: #d1d5db; }
  </style>
</head>
<body>
  <main>
    <h1>Amazon Bot Assistant</h1>
    <div class="muted">Test classification, Qdrant retrieval, reranking, answer review, and escalation.</div>
    <form id="chat-form">
      <label for="session-id">Conversation session</label>
      <input id="session-id" readonly>
      <button type="button" id="new-session">New conversation</button>
      <label for="user-id">Demo user ID</label>
      <input id="user-id" value="demo_user_001">
      <label for="query">Customer query</label>
      <textarea id="query" required placeholder="Example: My package is six days late"></textarea>
      <button id="send" type="submit">Send query</button>
      <span id="status" class="muted"></span>
    </form>
    <section id="result" hidden>
      <h3>Conversation</h3>
      <div id="conversation"></div>
      <div class="grid">
        <div class="card"><div class="muted">Status</div><div id="result-status" class="value"></div></div>
        <div class="card"><div class="muted">Intent</div><div id="intent" class="value"></div></div>
        <div class="card"><div class="muted">Confidence</div><div id="confidence" class="value"></div></div>
      </div>
      <h3>Answer</h3>
      <div id="answer"></div>
      <div id="escalation"></div>
      <div id="ticket-actions"></div>
      <details><summary>Retrieved conversations</summary><pre id="retrieved"></pre></details>
      <details><summary>Reviewer result</summary><pre id="review"></pre></details>
      <details><summary>Full response</summary><pre id="raw"></pre></details>
    </section>
    <div id="error" class="error"></div>
  </main>
  <script>
    const form = document.getElementById("chat-form");
    const send = document.getElementById("send");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const error = document.getElementById("error");
    const sessionId = localStorage.getItem("amazon_bot_session_id") || `session-${crypto.randomUUID()}`;
    localStorage.setItem("amazon_bot_session_id", sessionId);
    document.getElementById("session-id").value = sessionId;
    const text = value => value == null ? "" : String(value);
    const escapeHtml = value => text(value).replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[char]));
    form.addEventListener("submit", async event => {
      event.preventDefault();
      send.disabled = true; status.textContent = "Running workflow..."; error.textContent = "";
      result.hidden = true;
      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            user_id: document.getElementById("user-id").value || "demo_user_001",
            session_id: sessionId,
            query: document.getElementById("query").value
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || data.error || "Request failed");
        document.getElementById("result-status").textContent = text(data.status);
        document.getElementById("intent").textContent = text(data.intent);
        document.getElementById("confidence").textContent = `${(Number(data.confidence || 0) * 100).toFixed(1)}%`;
        document.getElementById("answer").textContent = data.answer || "No answer returned.";
        document.getElementById("conversation").innerHTML = (data.conversation || []).map(turn =>
          `<div class="card"><strong>${escapeHtml(turn.role)}:</strong> ${escapeHtml(turn.text)}</div>`
        ).join("");
        document.getElementById("escalation").innerHTML = data.escalation_reason
          ? `<p class="error"><strong>Escalated:</strong> ${text(data.escalation_reason)}</p>` : "";
        const ticket = data.human_bucket && data.human_bucket.ticket;
        document.getElementById("ticket-actions").innerHTML = ticket
          ? `<div class="ticket"><strong>Human ticket:</strong> ${text(ticket.ticket_id)}
             <span id="ticket-status">(${text(ticket.status)})</span>
             <button type="button" id="claim-ticket">Claim ticket</button></div>` : "";
        if (ticket) {
          document.getElementById("claim-ticket").addEventListener("click", async () => {
            const claim = await fetch(`/human-bucket/${encodeURIComponent(ticket.ticket_id)}/claim`, {method: "POST"});
            const claimed = await claim.json();
            document.getElementById("ticket-status").textContent = `(${text(claimed.status)})`;
            document.getElementById("claim-ticket").remove();
          });
        }
        document.getElementById("retrieved").textContent = JSON.stringify(data.retrieved_conversations || [], null, 2);
        document.getElementById("review").textContent = JSON.stringify(data.review_result || {}, null, 2);
        document.getElementById("raw").textContent = JSON.stringify(data, null, 2);
        result.hidden = false;
      } catch (err) {
        error.textContent = err.message;
      } finally {
        send.disabled = false; status.textContent = "";
      }
    });
    document.getElementById("new-session").addEventListener("click", async () => {
      await fetch(`/sessions/${encodeURIComponent(sessionId)}`, {method: "DELETE"});
      localStorage.removeItem("amazon_bot_session_id");
      location.reload();
    });
  </script>
</body>
</html>
