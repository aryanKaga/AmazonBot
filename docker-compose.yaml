services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: amazon_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:alpine
    container_name: amazon_redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    container_name: amazon_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: amazon_bot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
    container_name: amazon_api
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-amazon_customer_queries}
      QDRANT_CANDIDATE_LIMIT: ${QDRANT_CANDIDATE_LIMIT:-20}
      MAX_REVIEW_ITERATIONS: ${MAX_REVIEW_ITERATIONS:-3}
      ESCALATION_CONFIDENCE: ${ESCALATION_CONFIDENCE:-0.45}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://user:password@postgres:5432/amazon_bot
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      postgres:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
    container_name: amazon_worker
    command: python -m amazon_bot.worker
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: ${QDRANT_COLLECTION_NAME:-amazon_customer_queries}
      QDRANT_CANDIDATE_LIMIT: ${QDRANT_CANDIDATE_LIMIT:-20}
      MAX_REVIEW_ITERATIONS: ${MAX_REVIEW_ITERATIONS:-3}
      ESCALATION_CONFIDENCE: ${ESCALATION_CONFIDENCE:-0.45}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://user:password@postgres:5432/amazon_bot
    depends_on:
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      postgres:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: amazon_frontend
    environment:
      - NEXTAUTH_URL=http://localhost
      - NEXTAUTH_SECRET=super-secret-nextauth-key
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: amazon_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend

volumes:
  qdrant_data:
  pgdata: